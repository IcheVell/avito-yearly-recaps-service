services:
  backend:
    image: yearly-recaps-backend
    build:
      context: ./backend
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-yearly_recaps}
      RECAP_YEAR: ${RECAP_YEAR:-2026}
    ports:
      - "${BACKEND_PORT_LOCAL:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: yearly-recaps-frontend
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-yearly_recaps}
    ports:
      - "${DB_PORT_LOCAL:-5433}:${DB_PORT:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.sql:ro
      - ./backend/migrations/000002_seed.up.sql:/docker-entrypoint-initdb.d/000002_seed.sql:ro

volumes:
  db-data:
